<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplico Resume Attacher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="aplico-popup-container">
    
    <!-- HEADER -->
    <header class="aplico-header">
      <div class="brand-row">
        <div class="brand-identity">
          <div class="brand-logo-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-name">Aplico</h1>
            <span class="brand-tag">Resume Attacher</span>
          </div>
        </div>

        <!-- Authenticated User Menu -->
        <div id="auth-user-bar" class="auth-user-bar hidden">
          <span id="user-email-display" class="user-email-pill" title="Signed in user">user@example.com</span>
          <button id="btn-signout" class="icon-btn" title="Sign out of Aplico">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- NOTIFICATION / STATUS BANNER -->
    <div id="status-banner" class="status-banner hidden">
      <span id="status-icon" class="status-icon"></span>
      <span id="status-text" class="status-text"></span>
    </div>

    <!-- VIEW 1: SIGN IN VIEW -->
    <section id="auth-view" class="view-section">
      <div class="auth-card">
        <div class="auth-icon-wrap">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h2 class="view-title">Sign In to Aplico</h2>
        <p class="view-subtitle">Access your stored resumes and attach them to job forms with one click.</p>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="input-email">Email Address</label>
            <input type="email" id="input-email" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="input-password">Password</label>
            <input type="password" id="input-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          
          <button type="submit" id="btn-login" class="btn-primary">
            <span class="btn-text">Sign In</span>
            <div id="login-spinner" class="spinner hidden"></div>
          </button>
        </form>

        <div class="auth-footer">
          <span>Need an account?</span>
          <a href="https://aplico-black.vercel.app/auth?mode=signup" target="_blank" class="link-external">Register on Aplico</a>
        </div>
      </div>
    </section>

    <!-- VIEW 2: RESUMES LIST VIEW -->
    <section id="resumes-view" class="view-section hidden">
      <!-- Search & Refresh Header -->
      <div class="toolbar-row">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="resume-search" placeholder="Filter resumes by name or role...">
        </div>
        <button id="btn-refresh" class="icon-btn" title="Refresh resumes list">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <!-- Resumes List Container -->
      <div id="resumes-list-container" class="resumes-scroll-list">
        <!-- Dynamic Resume Cards will be rendered here -->
      </div>

      <!-- Loading State -->
      <div id="resumes-loading" class="state-container hidden">
        <div class="spinner large"></div>
        <p>Loading your resumes from Aplico...</p>
      </div>

      <!-- Empty State -->
      <div id="resumes-empty" class="state-container hidden">
        <div class="empty-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
        <h3>No resumes found</h3>
        <p>Upload your resumes in Aplico to see them here.</p>
        <button id="btn-open-aplico-empty" class="btn-secondary small">Open Resume Library</button>
      </div>

      <!-- ACTION BAR: Selected Resume & Attach -->
      <footer id="action-bar" class="action-bar hidden">
        <div class="selected-info">
          <span class="selected-label">Selected Resume</span>
          <span id="selected-resume-title" class="selected-name">—</span>
        </div>

        <button id="btn-use-resume" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
          <span id="btn-use-resume-text">Use this resume</span>
          <div id="attach-spinner" class="spinner hidden"></div>
        </button>

        <!-- Fallback Actions -->
        <div class="fallback-row">
          <button id="btn-download-pdf" class="btn-link" title="Download this PDF to your computer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Download PDF</span>
          </button>

          <button id="btn-open-library" class="btn-link" title="Open in Aplico Web">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>Open in Web</span>
          </button>
        </div>
      </footer>
    </section>

  </div>

  <!-- Scripts -->
  <script src="../lib/supabaseClient.js"></script>
  <script src="popup.js"></script>
</body>
</html>
